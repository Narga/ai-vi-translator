# Novel Translator v1.0 - Tệp Cấu hình

[API]
# Các API key của Gemini (cách nhau bởi dấu phẩy, script sẽ tự động xoay vòng)
GEMINI_API_KEYS = AIzaSyDUflNgvM1Z5NDt8USuKCiCntz5t3hR5bY,AIzaSyDMHBsM3Z8siaY_8QW-Pdo1_nIquyUFTa8

[MODEL]
# Model Gemini để sử dụng cho việc dịch thuật
MODEL = gemini-2.0-flash

[INPUT]
# Ngôn ngữ đầu vào: CN (Tiếng Trung) hoặc EN (Tiếng Anh)
# Việc này giúp prompt hướng dẫn AI tốt hơn
INPUT_LANG = CN

[PROCESSING]
# Số ký tự tối đa cho mỗi phần dịch (chunk)
CHUNK_SIZE = 24000

# Số luồng xử lý song song (0 = tự động nhận diện theo số lõi CPU)
MAX_WORKERS = 0

# "Nhiệt độ" dịch thuật (0.1 = bảo toàn, 1.0 = sáng tạo)
TEMPERATURE = 0.1

[CACHE]
# Bật cache để tránh dịch lại những nội dung giống hệt nhau
ENABLE_CACHE = true

# Tên thư mục cache
CACHE_DIR = cache

[OUTPUT]
# Bảng mã (encoding) cho file đầu ra
ENCODING = utf-8

# Tạo một file tổng hợp bên cạnh các file chương riêng lẻ
CREATE_COMBINED = true