# Novel Translator v2.4.2 - Tệp Cấu hình

[API]
# API keys được nạp từ file API.txt (mỗi key trên một dòng)
# Không cần cấu hình gì ở đây

[MODEL]
# Model Gemini để sử dụng cho việc dịch thuật chính.
MODEL = gemini-2.0-flash

# Model cho các tác vụ QA và kiểm tra sự nhất quán (có thể dùng model nhanh hơn).
QA_MODEL = gemini-2.0-flash
CONSISTENCY_MODEL = gemini-2.0-flash

[PROCESSING]
# --- Cấu hình thuật toán cắt file thông minh ---
# Kích thước tối thiểu cho mỗi phần dịch (chunk).
MIN_CHARS_PER_CHUNK = 18000
# Kích thước tối đa cho mỗi phần dịch (chunk).
# Thuật toán sẽ cố gắng cắt trong khoảng [min..max] để đảm bảo tự nhiên.
MAX_CHARS_PER_CHUNK = 22000

# "Nhiệt độ" dịch thuật (từ 0.0 đến 1.0).
# Giá trị thấp (ví dụ: 0.2) cho bản dịch bám sát gốc, giá trị cao (ví dụ: 0.7) cho bản dịch sáng tạo hơn.
TEMPERATURE = 0.75

# Thời gian chờ (giây) giữa mỗi yêu cầu gửi đến API.
# Giúp tránh vượt quá giới hạn RPM (requests per minute).
REQUEST_DELAY = 2

# --- Cấu hình QA tự động ---
# Số lần tối đa mà script sẽ thử sửa lỗi (ví dụ: ký tự tiếng Trung còn sót).
MAX_REFINEMENT_ATTEMPTS = 3

# Giới hạn độ dài dịch so với gốc (để phát hiện bản dịch bị cắt hoặc lặp).
# Nếu độ dài bản dịch nằm ngoài khoảng [min * original_len ... max * original_len],
# script sẽ kích hoạt dịch lại với prompt đặc biệt.
MIN_LENGTH_RATIO = 0.8
MAX_LENGTH_RATIO = 1.5

# Bật/tắt bước kiểm tra sự nhất quán sau khi dịch xong toàn bộ (consistency check).
ENABLE_CONSISTENCY_CHECK = True

# Số ký tự từ chunk trước được dùng làm ngữ cảnh để tăng tính liên kết.
# Đặt = 0 để tắt tính năng này.
CONTEXT_CHAR_COUNT = 1000

[CACHE]
# Bật/tắt cache dịch (khuyến nghị: bật để tiết kiệm API call khi resume).
ENABLE_CACHE = True

[DIRECTORIES]
# Các đường dẫn thư mục làm việc (có thể dùng đường dẫn tương đối hoặc tuyệt đối).
INPUT_DIR = workspace/input
OUTPUT_DIR = workspace/output
CACHE_DIR = workspace/cache
PROGRESS_DIR = workspace/progress

# Tên thư mục lưu trữ (archive) cho các file nguồn đã xử lý xong.
# Script sẽ bỏ qua thư mục này khi quét input.
ARCHIVE_DIR_NAME = _archive

[OUTPUT]
# Encoding cho các file đầu ra.
ENCODING = utf-8
