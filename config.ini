# Novel Translator v1.0 - Tệp Cấu hình

[API]
# Các API key của Gemini (cách nhau bởi dấu phẩy, script sẽ tự động xoay vòng)
GEMINI_API_KEYS = AIzaSyDUflNgvM1Z5NDt8USuKCiCntz5t3hR5bY,AIzaSyDMHBsM3Z8siaY_8QW-Pdo1_nIquyUFTa8

[MODEL]
# Model Gemini để sử dụng cho việc dịch thuật
MODEL = gemini-2.0-flash

[INPUT]
# Ngôn ngữ đầu vào của truyện: CN (Tiếng Trung) hoặc EN (Tiếng Anh).
INPUT_LANG = CN

[PROCESSING]
# Số ký tự tối đa cho mỗi phần dịch (chunk).
# Giá trị thấp hơn giúp giảm nguy cơ bị cắt ngắn nhưng tốn nhiều API call hơn.
# Kích thước chunk tối thiểu. Giải thuật sẽ cố gắng không cắt các chunk nhỏ hơn giá trị này.
MIN_CHARS_PER_CHUNK = 18000

# Kích thước chunk tối đa. Đây là giới hạn cứng cho mỗi chunk.
MAX_CHARS_PER_CHUNK = 22000

# "Nhiệt độ" dịch thuật (từ 0.0 đến 1.0).
# Giá trị thấp (ví dụ: 0.2) cho bản dịch bám sát gốc, giá trị cao (ví dụ: 0.7) cho bản dịch sáng tạo hơn.
# Mặc định mới: 0.45
TEMPERATURE = 0.65

# Thời gian chờ (giây) giữa mỗi yêu cầu gửi đến API.
# Giúp tránh lỗi bị giới hạn tần suất yêu cầu (rate limit). Nên để từ 0.2 đến 1.
REQUEST_DELAY = 0.75

# Số lần tối đa mà chương trình sẽ yêu cầu AI tự sửa lỗi cho một chunk
# nếu nó vẫn trả về kết quả có chứa ký tự tiếng Trung.
MAX_REFINEMENT_ATTEMPTS = 3

# Nếu bản dịch có độ dài chênh lệch quá 30% so với bản gốc (ngắn hơn 70% hoặc dài hơn 130%),
# chương trình sẽ tự động dịch lại từ đầu chunk đó để chống cắt ngắn.
MIN_LENGTH_RATIO = 1
MAX_LENGTH_RATIO = 3.5

# Bật/tắt bước kiểm tra sự nhất quán cuối cùng.
# Bước này sẽ đọc lại toàn bộ bản dịch và so sánh với ghi chú (notes.txt)
# để đảm bảo tên riêng, thuật ngữ được thống nhất. Tốn thêm chi phí API.
ENABLE_CONSISTENCY_CHECK = true

[PROMPTS]
# Định nghĩa các file prompt sẽ được sử dụng.
# Các file này phải nằm trong thư mục /prompts.
main_prompt_file = 01-main.txt
retranslate_prompt_file = 02-retranslate.txt
correction_prompt_file = 03-correction.txt
consistency_check_prompt_file = 04-consistency_check.txt

# File ghi chú cho truyện. Đặt file này vào thư mục của truyện đang dịch.
# Đây là file không bắt buộc, nếu không có, chương trình sẽ bỏ qua.
story_notes_file = notes.txt

[DIRECTORIES]
# Đường dẫn đến các thư mục làm việc, tất cả đều nằm trong /workspace.
INPUT_DIR = workspace/input
OUTPUT_DIR = workspace/output
CACHE_DIR = workspace/cache
PROGRESS_DIR = workspace/progress

[CACHE]
# Bật/tắt cache để tránh dịch lại những nội dung giống hệt nhau
ENABLE_CACHE = true

[OUTPUT]
# Bảng mã (encoding) cho file đầu ra
ENCODING = utf-8