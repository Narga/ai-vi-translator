# Novel Translator v2.0.0 - Tệp Cấu hình

[API]
# Các API key của Gemini (cách nhau bởi dấu phẩy, script sẽ tự động xoay vòng)
GEMINI_API_KEYS = 

[MODEL]
# Model Gemini để sử dụng cho việc dịch thuật chính.
MODEL = gemini-2.0-flash

# Model cho các tác vụ QA và kiểm tra sự nhất quán (có thể dùng model nhanh hơn).
QA_MODEL = gemini-2.0-flash
CONSISTENCY_MODEL = gemini-2.0-flash

[INPUT]
# Ngôn ngữ đầu vào của truyện: CN (Tiếng Trung) hoặc EN (Tiếng Anh).
INPUT_LANG = CN

[PROCESSING]
# --- Cấu hình thuật toán cắt file thông minh ---
# Kích thước tối thiểu cho mỗi phần dịch (chunk).
MIN_CHARS_PER_CHUNK = 18000
# Kích thước tối đa cho mỗi phần dịch (chunk).
# Thuật toán sẽ cố gắng cắt trong khoảng [min..max] để đảm bảo tự nhiên.
MAX_CHARS_PER_CHUNK = 22000

# "Nhiệt độ" dịch thuật (từ 0.0 đến 1.0).
# Giá trị thấp (ví dụ: 0.2) cho bản dịch bám sát gốc, giá trị cao (ví dụ: 0.7) cho bản dịch sáng tạo hơn.
TEMPERATURE = 0.75

# Thời gian chờ (giây) giữa mỗi yêu cầu gửi đến API.
# Giúp tránh lỗi bị giới hạn tần suất yêu cầu (rate limit).
REQUEST_DELAY = 0.75

# Số lần tối đa mà chương trình sẽ yêu cầu AI tự sửa lỗi sót ký tự Trung.
MAX_REFINEMENT_ATTEMPTS = 5

# Nếu bản dịch có độ dài chênh lệch so với bản gốc,
# chương trình sẽ tự động dịch lại từ đầu để chống cắt ngắn.
MIN_LENGTH_RATIO = 1.0
MAX_LENGTH_RATIO = 3.5

# Bật/tắt bước kiểm tra sự nhất quán cuối cùng dựa trên file ghi chú.
ENABLE_CONSISTENCY_CHECK = true

# === KẾ THỪA NGỮ CẢNH ===
# Số ký tự cuối cùng của chunk trước sẽ được lấy để làm ngữ cảnh cho chunk sau.
# Đặt là 0 để tắt tính năng này. Khuyến nghị: 500-1000.
CONTEXT_CHAR_COUNT = 1800

[PROMPTS]
# Định nghĩa các file prompt sẽ được sử dụng trong thư mục /prompts.
main_prompt_file = 01-main.txt
retranslate_prompt_file = 02-retranslate.txt
correction_prompt_file = 03-correction.txt
consistency_check_prompt_file = 04-consistency_check.txt

# File ghi chú thuật ngữ cho truyện (không bắt buộc).
story_notes_file = notes.txt
# File chứa đoạn văn dịch mẫu để AI học theo văn phong (không bắt buộc).
style_sample_file = sample.txt

[DIRECTORIES]
# Đường dẫn đến các thư mục làm việc.
INPUT_DIR = workspace/input
OUTPUT_DIR = workspace/output
CACHE_DIR = workspace/cache
PROGRESS_DIR = workspace/progress
# Mọi file/thư mục con bên trong thư mục này sẽ bị bỏ qua khi quét input.
ARCHIVE_DIR_NAME = _archive

[CACHE]
# Bật/tắt cache để tránh dịch lại những nội dung giống hệt nhau.
ENABLE_CACHE = true

[OUTPUT]
# Bảng mã (encoding) cho file đầu ra.
ENCODING = utf-8