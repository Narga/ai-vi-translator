    <!-- Clean corrupted Alpine.js $persist localStorage keys -->
    <script>
        ['nt_active_project_tab'].forEach(function(key) {
            try { var v = localStorage.getItem(key); if (v !== null) JSON.parse(v); } catch(e) { localStorage.removeItem(key); }
        });
        // Fallback: remove x-cloak after 3s if Alpine fails to init
        setTimeout(function() { document.querySelectorAll('[x-cloak]').forEach(function(el) { el.removeAttribute('x-cloak'); }); }, 3000);
    </script>
    <script>

        document.addEventListener('alpine:init', function() {
