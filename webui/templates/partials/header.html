<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Translator {{ app_version }}</title>
    <!-- Tachyons CSS Framework -->
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}">
    <script>
        window.initialPrompts = {{ prompts_json | safe }};
        window.initialAvailableModels = {{ available_models | safe }};
        window.initialDefaultModel = '{{ default_model }}';
    </script>
</head>

<body class="bg-near-white sans-serif dark-gray">

    <!-- TOP NAVIGATION BAR -->
    <header class="header-container shadow-sm">
        <!-- Brand (Left) -->
        <div class="header-left flex items-center">
            <span class="f3 mr2">📚</span>
            <span class="fw6 f4 dark-gray">Content Translator<sup class="f7 silver fw4 ml1">v{{ app_version }}</sup></span>
        </div>

        <!-- Navigation (Center) -->
        <nav class="header-center flex justify-center">
            <a href="#workspace" class="nav-link active" data-tab="workspace">Dự án</a>
            <a href="#config" class="nav-link" data-tab="config">Cấu hình</a>
            <a href="#prompts" class="nav-link" data-tab="prompts">Prompts</a>
            <a href="#plugins" class="nav-link" data-tab="plugins">Plugins</a>
            <a href="#logs" class="nav-link" data-tab="logs">Nhật ký</a>
            <a href="#archive" class="nav-link" data-tab="archive">Lưu trữ</a>
        </nav>

        <!-- Stats (Right) -->
        <div class="header-right gray">
            <div class="flex items-center gap-3 ba b--near-white bg-near-white br-pill ph3 pv1 shadow-sm f7">
                <span title="API Keys">🔑 <strong id="api-keys-count" class="blue">--</strong></span>
                <span class="silver">|</span>
                <span title="Bộ nhớ đệm (Dung lượng và số tệp)">📦 <strong id="cache-size" class="green">--</strong>MB <small class="silver">(<span id="cache-count">--</span>)</small></span>
                <span class="silver">|</span>
                <span title="Dự án (Hoạt động và Lưu trữ)">📁 <strong id="project-count" class="orange">--</strong> <small class="silver">(<span id="archive-count" class="orange">--</span>)</small></span>
                <button class="ml2 pointer bn bg-transparent hover-gray" onclick="restartServer()" title="Khởi động lại Server">🔄</button>
            </div>
        </div>
    </header>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="nt-main-bg">
