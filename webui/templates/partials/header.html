<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Translator {{ app_version }}</title>
    <!-- Tachyons CSS Framework -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tachyons.min.css') }}" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}-f">
    <script>
        window.initialPrompts = {{ prompts_json | safe }};
        window.initialAvailableModels = {{ available_models | safe }};
        window.initialDefaultModel = '{{ default_model }}';
    </script>
</head>

<body class="bg-near-white sans-serif dark-gray">

    <!-- TOP NAVIGATION BAR -->
    <header class="header-container shadow-sm">
        <!-- Brand (Left) -->
        <div class="header-left flex items-center">
            <span class="fw6 f4 dark-gray">Content Translator<sup class="f7 silver fw4 ml1">v{{ app_version }}</sup></span>
        </div>

        <!-- Navigation (Center) -->
        <nav class="header-center flex justify-center">
            <a href="#projects" class="nav-link active" data-tab="projects">Dự án</a>
            <a href="#config" class="nav-link" data-tab="config">Cấu hình</a>
            <a href="#prompts" class="nav-link" data-tab="prompts">Chỉ dẫn AI</a>
            <a href="#logs" class="nav-link" data-tab="logs">Nhật ký</a>
            <a href="#archive" class="nav-link" data-tab="archive">Lưu trữ</a>
            <a href="#docs" class="nav-link" data-tab="docs">Tài liệu</a>
        </nav>

        <!-- Stats (Right) -->
        <div class="header-right flex items-center gap-2">
            <div class="flex items-center gap-3 bg-near-white br-pill ph3 pv1 shadow-sm f7">
                <span title="Dự án (Hoạt động và Lưu trữ)" class="flex items-center gap-1"><span class="orange mr1">●</span>Dự án: <strong id="project-count">--</strong> <small class="silver">(<span id="archive-count">--</span>)</small></span>
                <span title="Tiến trình đang chạy" class="flex items-center gap-1 ml3"><span class="green mr1">▶</span>Tasks: <strong id="task-count">0</strong></span>
                <button class="ml2 pointer bn bg-transparent hover-gray" onclick="ApiClient.restartServer()" title="Khởi động lại Server">↻</button>
            </div>
        </div>
    </header>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container"></div>

    <!-- MAIN CONTENT AREA -->
    <main class="nt-main-bg">
