<!-- ==================== TAB 3: PROMPT MANAGER ==================== -->
<section id="tab-prompts" class="nt-tab-content">
    <div class="workspace-wrapper flex flex-column items-center" style="min-height: 100%;">
        <!-- TWO AREAS: Library Sets (Left) and Editor (Right) -->
        <div class="w-100 mw8 flex flex-column flex-row-l gap-4">

            <!-- AREA 1: Library Sets List (Sidebar) -->
            <div class="w-100 w-30-l flex flex-column" style="min-height: 500px">
                <div class="ba b--black-10 br2 bg-white shadow-1 h-100 flex flex-column">
                    <div class="pa3 bb b--black-10 bg-near-white flex justify-between items-center">
                        <h2 class="f5 ma0 fw6 dark-gray">Thư viện Chỉ dẫn AI</h2>
                        <button id="btn-new-library" class="pointer ph3 pv1 f7 bn white bg-green br2 shadow-1 hover-bg-dark-green fw6">+ Thêm bộ</button>
                    </div>
                    <div class="pa3 flex-auto flex flex-column overflow-hidden">
                        <div class="flex-auto overflow-y-auto ba b--black-10 br2 bg-near-white" id="library-list">
                            <div class="pa3 tc silver i">Đang tải...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AREA 2: Library Set Editor -->
            <div class="w-100 w-70-l flex flex-column" style="min-height: 500px">
                <div id="library-prompt-editor" class="ba b--black-10 br2 bg-white flex-auto flex flex-column relative shadow-1">
                    <!-- Top header -->
                    <div class="pa3 flex justify-between items-center bb b--black-10 bg-near-white">
                        <div class="flex flex-column">
                            <h2 id="library-prompt-title" class="f5 ma0 fw6 dark-gray db">Chưa chọn bộ prompt</h2>
                            <span id="library-prompt-desc" class="f7 silver fw4 mt1 db">Mô tả...</span>
                        </div>
                        <div class="flex gap-2">
                            <button id="btn-delete-library-set" class="pointer ph3 pv1 f7 bn white bg-red br2 shadow-1 hover-bg-dark-red fw6 dn">Xóa bộ</button>
                            <button id="btn-info-library-set" class="pointer ph3 pv1 f7 ba b--black-20 bg-white br2 shadow-sm hover-bg-near-white fw6 dn">Thông tin</button>
                            <button id="btn-save-library-set" class="pointer ph3 pv1 f7 bn white bg-blue br2 shadow-1 hover-bg-dark-blue fw6">Lưu</button>
                        </div>
                    </div>

                    <div class="pa3 flex-auto flex flex-column">
                        <!-- Radio inputs matching style.css -->
                        <input class="nt-tab-radio" type="radio" name="system-prompt-tabs" id="system-tab-main" checked>
                        <input class="nt-tab-radio" type="radio" name="system-prompt-tabs" id="system-tab-summary">
                        <input class="nt-tab-radio" type="radio" name="system-prompt-tabs" id="system-tab-relationships">
                        <input class="nt-tab-radio" type="radio" name="system-prompt-tabs" id="system-tab-glossary">
                        <input class="nt-tab-radio" type="radio" name="system-prompt-tabs" id="system-tab-chinh-ta">

                        <div class="nt-tab-nav flex bb b--black-10 mb3 flex-wrap" role="tablist" aria-label="Prompt Hệ thống">
                            <label for="system-tab-main" class="nt-tab-label dib ph3 pv2 gray f7 fw6 tracked uppercase" role="tab" aria-controls="system-panel-main">Dịch thuật</label>
                            <label for="system-tab-summary" class="nt-tab-label dib ph3 pv2 gray f7 fw6 tracked uppercase" role="tab" aria-controls="system-panel-summary">Tóm tắt</label>
                            <label for="system-tab-relationships" class="nt-tab-label dib ph3 pv2 gray f7 fw6 tracked uppercase" role="tab" aria-controls="system-panel-relationships">Mối quan hệ</label>
                            <label for="system-tab-glossary" class="nt-tab-label dib ph3 pv2 gray f7 fw6 tracked uppercase" role="tab" aria-controls="system-panel-glossary">Thuật ngữ</label>
                            <label for="system-tab-chinh-ta" class="nt-tab-label dib ph3 pv2 gray f7 fw6 tracked uppercase" role="tab" aria-controls="system-panel-chinh-ta">Chính tả</label>
                        </div>

                        <div class="nt-tab-panels flex-auto">
                            <section id="system-panel-main" class="nt-tab-panel" role="tabpanel" aria-labelledby="system-tab-main">
                                <textarea id="set-main-text" class="ba b--black-10 br2 pa3 w-100 code f7 outline-0 prompt-textarea" style="height: 350px;" placeholder="Prompt dịch thuật của bộ..."></textarea>
                            </section>
                            <section id="system-panel-summary" class="nt-tab-panel" role="tabpanel" aria-labelledby="system-tab-summary">
                                <textarea id="set-summary-text" class="ba b--black-10 br2 pa3 w-100 code f7 outline-0 prompt-textarea" style="height: 350px;" placeholder="Prompt tóm tắt của bộ..."></textarea>
                            </section>
                            <section id="system-panel-relationships" class="nt-tab-panel" role="tabpanel" aria-labelledby="system-tab-relationships">
                                <textarea id="set-relationships-text" class="ba b--black-10 br2 pa3 w-100 code f7 outline-0 prompt-textarea" style="height: 350px;" placeholder="Prompt mối quan hệ của bộ..."></textarea>
                            </section>
                            <section id="system-panel-glossary" class="nt-tab-panel" role="tabpanel" aria-labelledby="system-tab-glossary">
                                <textarea id="set-glossary-text" class="ba b--black-10 br2 pa3 w-100 code f7 outline-0 prompt-textarea" style="height: 350px;" placeholder="Prompt thuật ngữ của bộ..."></textarea>
                            </section>
                            <section id="system-panel-chinh-ta" class="nt-tab-panel" role="tabpanel" aria-labelledby="system-tab-chinh-ta">
                                <textarea id="set-chinh_ta-text" class="ba b--black-10 br2 pa3 w-100 code f7 outline-0 prompt-textarea" style="height: 350px;" placeholder="Prompt kiểm tra chính tả của bộ..."></textarea>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
