	# Novel Translator v4.0.0 - Tệp Cấu hình

[API]
# API keys được nạp từ file API.txt (mỗi key trên một dòng)
# Với 30 API keys, capacity tổng = 600 RPD (20 RPD/key)
# Không cần cấu hình gì ở đây

[SDK]
# SDK sử dụng cho Gemini API:
#   - google-genai: SDK mới (khuyến nghị, mặc định)
#   - google-generativeai: SDK cũ (legacy, fallback)
SDK = google-genai

# Fallback SDK khi SDK chính không khả dụng
FALLBACK_SDK = google-generativeai

[MODEL]
# Model Gemini để sử dụng cho việc dịch thuật chính.
# gemini-3-flash-preview: Model mới nhất, hỗ trợ thinking levels, 1M context window
MODEL = gemini-3-flash-preview

# Fallback model khi model chính không khả dụng
FALLBACK_MODEL = gemini-2.0-flash

# Model cho các tác vụ QA và kiểm tra sự nhất quán
QA_MODEL = gemini-3-flash-preview
CONSISTENCY_MODEL = gemini-3-flash-preview

# Thinking level cho Gemini 3 models (MINIMAL/LOW/MEDIUM/HIGH)
# MINIMAL: Nhanh nhất, ít reasoning
# LOW: Cân bằng giữa tốc độ và chất lượng
# MEDIUM: Mặc định, phù hợp hầu hết task
# HIGH: Chất lượng cao nhất, chậm nhất
THINKING_LEVEL = MEDIUM

[PROCESSING]
# --- Cấu hình thuật toán cắt file thông minh ---
# Kích thước tối thiểu cho mỗi phần dịch (chunk).
MIN_CHARS_PER_CHUNK = 18000
# Kích thước tối đa cho mỗi phần dịch (chunk).
# Thuật toán sẽ cố gắng cắt trong khoảng [min..max] để đảm bảo tự nhiên.
MAX_CHARS_PER_CHUNK = 22000

# "Nhiệt độ" dịch thuật (từ 0.0 đến 2.0).
# Gemini 3 khuyến nghị giữ 1.0 cho kết quả tối ưu.
TEMPERATURE = 1.0

# Thời gian chờ (giây) giữa mỗi yêu cầu gửi đến API.
# Với 30 keys và 20 RPD/key, có thể giảm delay xuống 1s.
REQUEST_DELAY = 1

# --- Cấu hình QA tự động ---
# Số lần tối đa thử sửa lỗi ký tự tiếng Trung còn sót lại.
MAX_REFINEMENT_ATTEMPTS = 2

# Ngưỡng tỷ lệ độ dài để phát hiện chunk bị cắt ngắn hoặc quá dài.
# Nếu len(dịch) < min_ratio * len(gốc) hoặc > max_ratio * len(gốc) → dịch lại.
MIN_LENGTH_RATIO = 0.5
MAX_LENGTH_RATIO = 5.0

# --- Cấu hình Correction Mode (v2.8.2) ---
# Chế độ sửa lỗi ký tự Trung:
#   - parallel: Gửi song song chunk gốc + chunk dịch lỗi (tiết kiệm 40-60% token)
#   - legacy: Gửi chỉ chunk dịch lỗi như phiên bản cũ
CORRECTION_MODE = parallel

# Ngôn ngữ nguồn:
#   - CN: Tiếng Trung (bật chế độ sửa ký tự Trung)
#   - Khác: Bỏ qua sửa ký tự Trung
INPUT_LANG = CN

# --- Cấu hình Context Continuity ---
# Số ký tự từ bản dịch chunk trước để làm ngữ cảnh cho chunk hiện tại.
# Giúp duy trì tính liên tục giữa các chunks.
# Đặt = 0 để tắt tính năng này.
CONTEXT_CHAR_COUNT = 500

# --- Cấu hình Consistency Check ---
# Bật/tắt kiểm tra nhất quán tên nhân vật, thuật ngữ sau khi dịch.
ENABLE_CONSISTENCY_CHECK = true

[DIRECTORIES]
# Tên thư mục để lưu trữ các file đã dịch (archive).
ARCHIVE_DIR_NAME = _archive
# Các đường dẫn thư mục làm việc (có thể dùng đường dẫn tương đối hoặc tuyệt đối).
INPUT_DIR = workspace/input
OUTPUT_DIR = workspace/output
CACHE_DIR = workspace/cache
PROGRESS_DIR = workspace/progress

[CACHE]
# Bật/tắt cache kết quả dịch để tránh dịch lại chunks giống nhau.
ENABLE_CACHE = true

[OUTPUT]
# Encoding cho file đầu ra (khuyến nghị: utf-8).
ENCODING = utf-8

