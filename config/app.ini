[PROVIDER]
# Nhà cung cấp AI đang hoạt động: gemini hoặc openai
ACTIVE_PROVIDER = gemini

[API]
# API keys được nạp từ file API.txt
# Capacity: 10 keys * 20 RPD = 200 requests/day
# Max throughput: 200 * 100k chars = 20M chars/day

[OPENAI]
# Base URL cho OpenRouter/proxy (để trống nếu dùng OpenAI trực tiếp)
# Ví dụ: https://openrouter.ai/api/v1
BASE_URL = https://openrouter.ai/api/v1
# Model mặc định cho OpenAI provider
MODEL = gpt-4o-mini

[MODEL]
# Model Gemini để sử dụng cho việc dịch thuật chính.
# gemini-3-flash-preview: 1M context, 64k output token
MODEL = gemini-3-flash-preview

# Model cho các tác vụ QA và kiểm tra sự nhất quán
QA_MODEL = gemini-3-flash-preview

# Thinking level cho Gemini 3 (MEDIUM cân bằng speed/quality)
THINKING_LEVEL = MEDIUM

[PROCESSING]
# Với output limit 64k tokens (~250k chars), input 20k chars là an toàn và tối ưu.
MAX_CHARS_PER_CHUNK = 20000

# "Nhiệt độ" dịch thuật: 1.0 (khuyến nghị cho Gemini 3)
TEMPERATURE = 1.0

# Thời gian chờ (giây) giữa mỗi yêu cầu.
REQUEST_DELAY = 5

# --- Cấu hình Context Continuity ---
# Số ký tự từ bản dịch chunk trước để làm ngữ cảnh cho chunk hiện tại.
# Giúp duy trì tính liên tục giữa các chunks.
# Đặt = 0 để tắt tính năng này.
CONTEXT_CHAR_COUNT = 500

[DIRECTORIES]
# Tên thư mục để lưu trữ các file đã dịch (archive).
ARCHIVE_DIR_NAME = _archive
# Các đường dẫn thư mục làm việc (có thể dùng đường dẫn tương đối hoặc tuyệt đối).
INPUT_DIR = workspace/input
OUTPUT_DIR = workspace/output
CACHE_DIR = workspace/cache
LOGS_DIR = workspace/logs

[CACHE]
# Bật/tắt cache kết quả dịch để tránh dịch lại chunks giống nhau.
ENABLE_CACHE = true
